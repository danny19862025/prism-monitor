name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Read live sensors once
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python tools/fetch_presentmon.py; fi
          python main.py --print
      - run: python build.py
      - name: Smoke test the packaged app
        shell: python
        run: |
          import os, subprocess, sys
          env = dict(os.environ, QT_QPA_PLATFORM='offscreen')
          exe = 'dist/PrismMonitor/PrismMonitor.exe' if sys.platform == 'win32' else 'dist/PrismMonitor/PrismMonitor'
          subprocess.run([exe, '--smoke-test'], env=env, timeout=60, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: PrismMonitor-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
