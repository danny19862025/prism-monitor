name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Qt system libraries (Linux)
        # PySide6's QtGui loads EGL/GL, fontconfig and xkbcommon even offscreen.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libfontconfig1 libxkbcommon0 libdbus-1-3 gcc
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Smoke test
        run: python monitor_main.py --smoke-test --config smoke-settings.json
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the game FPS layer (Linux)
        if: runner.os == 'Linux'
        run: python tools/build_fps_layer.py
      - name: Build the Windows app, ZIP and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          python build.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PrismMonitor-windows
          path: |
            dist/PrismMonitor-windows.zip
            dist/PrismMonitor-Setup-*.exe
          if-no-files-found: error
